{% extends "layouts/base.html" %}

{% block title %}Apply for {{ job.title }}{% endblock %}

{% block public_content %}
<div class="form-container" data-aos="fade-up">
  <div class="card">
    <div class="card-header">
      <h1>Apply for: {{ job.title }}</h1>
      <p class="job-location">{{ job.location }} | {{ job.type }}</p>
    </div>
    <div class="card-body">
      <form action="{{ url_for('main.submit_application') }}" method="post" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="job_id" value="{{ job._id }}">
        
        <div class="form-group">
          <label for="name">Full Name:</label>
          <input type="text" id="name" name="name" class="form-control" required>
        </div>
        
        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" class="form-control" required>
        </div>
        
        <div class="form-group">
          <label for="resume">Resume (PDF only):</label>
          <input type="file" id="resume" name="resume" class="form-control-file" accept=".pdf" required>
        </div>
        
        <button type="submit" class="btn btn-primary btn-full">Submit Application</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
