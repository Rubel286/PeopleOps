{% extends "layouts/base.html" %}
{% block title %}Update Goal Progress{% endblock %}

{% block content %}
<h1>Update Progress for Goal</h1>

<div class="card">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label for="progress">Progress (0-100%)</label>
            <input type="number" id="progress" name="progress" min="0" max="100" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-primary">Update</button>
    </form>
</div>
{% endblock %}
