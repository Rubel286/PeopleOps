{% extends "layouts/base.html" %}
{% block title %}Log In{% endblock %}
{% block public_content %}
<div class="auth-container">
    <div class="card">
      <h2>Candidate Log In</h2>
      <p>Welcome back! Please log in to continue.</p>
      <form method="POST" action="{{ url_for('auth.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="form-group">
            <label for="email"><i data-feather="mail"></i> Email</label>
            <input type="email" id="email" name="email" class="form-control" required aria-required="true" title="Enter your email">
        </div>
        <div class="form-group">
            <label for="password"><i data-feather="lock"></i> Password</label>
            <input type="password" id="password" name="password" class="form-control" required aria-required="true" title="Enter your password">
        </div>
        <button type="submit" class="btn btn-primary btn-full"><i data-feather="log-in"></i> Log In</button>
      </form>
      <p class="auth-link">Don't have an account? <a href="{{ url_for('auth.signup') }}" title="Create a new account">Sign Up</a></p>
      <p class="admin-link">Are you an administrator? <a href="{{ url_for('auth.admin_login') }}" title="Admin login">Log in here</a>.</p>
    </div>
</div>
{% endblock %}
